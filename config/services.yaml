parameters:
    app.admin.email: '%env(ADMIN_EMAIL)%'
    app.admin.name: 'TSA Thérapie'
    app.app_url: '%env(APP_URL)%'
    app.twilio.test_number: '%env(TWILIO_TEST_NUMBER)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # =========================
    # EMAIL SERVICE
    # =========================
    App\Service\EmailRappelService:
        arguments:
            $adminEmail: '%app.admin.email%'
            $adminName: '%app.admin.name%'
            $projectDir: '%kernel.project_dir%'

    # =========================
    # TWILIO SMS
    # =========================
    App\Service\TwilioService:
        arguments:
            $accountSid: '%env(TWILIO_ACCOUNT_SID)%'
            $authToken: '%env(TWILIO_AUTH_TOKEN)%'
            $fromNumber: '%env(TWILIO_FROM_NUMBER)%'

    # =========================
    # EMAIL RAPPORTS DE PROGRESSION
    # =========================
    App\Service\ProgressReportEmailService:
        arguments:
            $adminEmail: '%env(ADMIN_EMAIL)%'
            $adminName: '%env(ADMIN_NAME)%'

    # =========================
    # GOOGLE CALENDAR
    # =========================
    App\Service\GoogleCalendarService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # =========================
    # EVENT LISTENERS
    # =========================
    App\EventListener\SuiviProgressionListener:
        tags:
            - name: doctrine.orm.entity_listener
              entity: App\Entity\SuiviProgression
              event: postPersist
              method: postPersist

   

    
   